<header class="editor">
<h1>友達紹介カード テンプレート</h1>
<p class="lead">手順は同じフォルダの readme.txt を見てください。</p>
<div class="setup-grid">

<option value="tate-23" data-family="tate" data-w="73.3" data-h="110" data-top="35" data-note="1240 × 1860 px以上">たて　2:3</option>

<div id="printSheets" aria-label="A4・10面印刷用"></div>

<script>
(()=>{
const $=id=>document.getElementById(id),status=$('status');let dirty=false;
const say=(text,error=false)=>{status.textContent=text;status.classList.toggle('overflow-warning',error)};
function refresh(){const states=[['photo','写真'],['qrDetails','教室詳細QR'],['qr','申込QR']];say(states.every(([id])=>$(id).hasAttribute('src'))?'写真・QR 設定済み':states.map(([id,label])=>label+($(id).hasAttribute('src')?'設定済み':'未設定')).join('／')+'')}
function syncPhoto(){ $('photo').style.objectPosition=`${$('photoX').value}% ${$('photoY').value}%`;$('photo').style.transform=`scale(${$('photoZoom').value/100})`;dirty=true; }
for(const id of ['photoX','photoY','photoZoom'])$(id).addEventListener('input',syncPhoto);
$('resetPhoto').onclick=()=>{$('photoX').value=50;$('photoY').value=50;$('photoZoom').value=100;syncPhoto()};
for(const [kind,btn,area] of [['photo','choosePhoto','photoArea'],['qrDetails','chooseQrDetails','qrDetailsArea'],['qr','chooseQr','qrArea']]){
const choose=()=>$(kind+'File').click();$(btn).onclick=choose;$(area).onclick=choose;$(area).onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};
$(kind+'File').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){say('PNG・JPEG・WebPを選んでください。',true);return;}try{const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const im=new Image();im.src=data;await im.decode();$(kind).src=data;$(kind).hidden=false;$(kind).style.display='block';$(area).classList.add('has-image');dirty=true;refresh();if(kind==='photo'&&(im.naturalWidth<733||im.naturalHeight<1016))say('写真が小さめです。推奨サイズを確認してください。',true);if(kind!=='photo'&&Math.abs(im.naturalWidth/im.naturalHeight-1)>.05)say('QRは正方形の画像を推奨します。',true);}catch{say('画像を読み込めませんでした。',true)}e.target.value='';};
}
document.querySelectorAll('[contenteditable]').forEach(el=>{el.addEventListener('input',()=>{dirty=true;say('文字を変更しました。')});el.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))})});
$('save').onclick=()=>{const clone=document.documentElement.cloneNode(true);cleanMoveState(clone);clone.querySelector('#printSheets').replaceChildren();clone.querySelector('body').classList.remove('sheet-preview');clone.querySelector('#previewSheets').textContent='A4・10面プレビュー';for(const id of ['photoX','photoY','photoZoom'])clone.querySelector('#'+id).setAttribute('value',$(id).value);clone.querySelector('#status').textContent='';for(const id of ['schoolNameInput','taglineInput'])clone.querySelector('#'+id).setAttribute('value',$(id).value);clone.querySelectorAll('#photoRatio option').forEach(o=>o.toggleAttribute('selected',o.value===$('photoRatio').value));const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='友達紹介カード_'+(schoolInput.value.replace(/^久保田学園[\s　]*/,'').trim()||'教室')+'_編集済み.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);dirty=false;say('HTMLを保存しました。')};
function buildSheets(){
const root=$('printSheets');root.replaceChildren();
for(const [side,label] of [['front','表面10枚'],['back','裏面10枚（長辺とじ用）']]){
const sheet=document.createElement('section');sheet.className='sheet-page '+side+'-sheet';sheet.setAttribute('aria-label',label);
const original=document.querySelector('.cards .'+side);
for(let i=0;i<10;i++){const cell=document.createElement('div');cell.className='print-cell';const card=original.cloneNode(true);card.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));card.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));card.querySelectorAll('[tabindex]').forEach(n=>n.removeAttribute('tabindex'));cell.append(card);sheet.append(cell)}root.append(sheet);
}}
$('previewSheets').onclick=()=>{setMoveMode(false);const show=document.body.classList.toggle('sheet-preview');if(show)buildSheets();$('previewSheets').textContent=show?'カードの編集に戻る':'A4・10面プレビュー'};
// Translate is independent of the existing rotation/scale styling.
const printScale=55/105, cards=document.querySelector('.cards');
let moving=false,selected=null,gesture=null;const moveHistory=[];
const targets=[['.photo-area','写真枠'],['.front-title','表の見出し'],['.aside-note','ひとりで悩まなくて'],['.subtitle','が言いやすい塾です'],['.checklist li','チェック項目'],['.front-message','先生との距離が近いから'],['.ribbon','友達紹介ラベル'],['.together','一緒に来てみない'],['.english','Study Together'],['.front-school .school','表の教室名'],['.front-school .tagline','表のサブコピー'],['.back-heading','裏の見出し'],['.back-note','どんなことでも'],['.talk','相談の吹き出し'],['.reassure','何でも完璧に'],['.back-cta','まずは確かめに'],['.form','名前・学年の記入欄'],['.back-sticker','友達と一緒に'],['.qr-destination','QRと案内ラベル'],['.back-school','裏の教室名']];
for(const [selector,label] of targets)cards.querySelectorAll(selector).forEach((el,i)=>{el.dataset.movable=label+(selector==='.talk'||selector==='.checklist li'?' '+(i+1):'');if(!el.dataset.moveX)el.dataset.moveX='0';if(!el.dataset.moveY)el.dataset.moveY='0'});
function coords(el){return {x:Number(el.dataset.moveX)||0,y:Number(el.dataset.moveY)||0}}
function position(el,x,y){el.dataset.moveX=String(x);el.dataset.moveY=String(y);el.style.translate=`${x}mm ${y}mm`;if(el===selected)updateMovePanel()}
function updateMovePanel(){const c=selected?coords(selected):{x:0,y:0};$('moveSelection').textContent=selected?selected.dataset.movable:'動かしたい要素をドラッグ';for(const [id,v] of [['moveX',c.x],['moveY',c.y]]){$(id).disabled=!selected;if(document.activeElement!==$(id))$(id).value=(v*printScale).toFixed(2)}$('resetMove').disabled=!selected;$('undoMove').disabled=!moveHistory.length}
function selectMove(el){selected?.classList.remove('move-selected');selected=el;selected?.classList.add('move-selected');updateMovePanel()}
function remember(el,before){const after=coords(el);if(Math.abs(after.x-before.x)+Math.abs(after.y-before.y)<.00001)return;moveHistory.push({el,...before});if(moveHistory.length>100)moveHistory.shift();dirty=true;updateMovePanel();say('配置を変更しました。')}
function endGesture(cancel=false){if(!gesture)return;const g=gesture;gesture=null;g.el.classList.remove('move-dragging');if(g.el.hasPointerCapture(g.id))g.el.releasePointerCapture(g.id);if(cancel)position(g.el,g.x,g.y);else remember(g.el,{x:g.x,y:g.y})}
function setMoveMode(on){endGesture();moving=on;document.body.classList.toggle('move-mode',on);$('moveMode').setAttribute('aria-pressed',String(on));$('moveMode').textContent=on?'配置調整中':'配置をドラッグで調整';if(on){document.activeElement?.blur();document.body.classList.remove('sheet-preview');$('previewSheets').textContent='A4・10面プレビュー';cards.querySelectorAll('[contenteditable]').forEach(el=>{if(!el.hasAttribute('data-edit-before-move'))el.dataset.editBeforeMove=el.getAttribute('contenteditable');el.setAttribute('contenteditable','false')});say('点線の要素をドラッグしてください。')}else{cards.querySelectorAll('[data-edit-before-move]').forEach(el=>{el.setAttribute('contenteditable',el.dataset.editBeforeMove);delete el.dataset.editBeforeMove});selectMove(null)}}
function cleanMoveState(root){root.querySelector('body').classList.remove('move-mode');root.querySelectorAll('[data-edit-before-move]').forEach(el=>{el.setAttribute('contenteditable',el.dataset.editBeforeMove);delete el.dataset.editBeforeMove});root.querySelectorAll('.move-selected,.move-dragging').forEach(el=>el.classList.remove('move-selected','move-dragging'));root.querySelector('#moveMode').setAttribute('aria-pressed','false');root.querySelector('#moveMode').textContent='配置をドラッグで調整'}
$('moveMode').onclick=()=>setMoveMode(!moving);$('finishMove').onclick=()=>setMoveMode(false);
cards.addEventListener('pointerdown',e=>{if(!moving||e.button!==0||gesture)return;const el=e.target.closest('[data-movable]');if(!el){selectMove(null);return}e.preventDefault();e.stopPropagation();document.activeElement?.blur();selectMove(el);const card=el.closest('.card'),c=coords(el);gesture={el,id:e.pointerId,startX:e.clientX,startY:e.clientY,x:c.x,y:c.y,pxPerMm:card.getBoundingClientRect().width/105};el.setPointerCapture(e.pointerId);el.classList.add('move-dragging')},true);
cards.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.id)return;e.preventDefault();const g=gesture;position(g.el,g.x+(e.clientX-g.startX)/g.pxPerMm,g.y+(e.clientY-g.startY)/g.pxPerMm)},true);
cards.addEventListener('pointerup',e=>{if(gesture&&e.pointerId===gesture.id){e.preventDefault();endGesture()}},true);
cards.addEventListener('pointercancel',()=>endGesture(true),true);
cards.addEventListener('lostpointercapture',()=>endGesture(true),true);
cards.addEventListener('click',e=>{if(moving){e.preventDefault();e.stopImmediatePropagation()}},true);
cards.addEventListener('dragstart',e=>{if(moving)e.preventDefault()},true);
for(const id of ['moveX','moveY'])$(id).addEventListener('change',()=>{if(!selected)return;const v=$(id).valueAsNumber;if(!Number.isFinite(v)){updateMovePanel();return}const before=coords(selected);position(selected,id==='moveX'?v/printScale:before.x,id==='moveY'?v/printScale:before.y);remember(selected,before)});
$('resetMove').onclick=()=>{if(selected){const before=coords(selected);position(selected,0,0);remember(selected,before)}};
$('undoMove').onclick=()=>{const last=moveHistory.pop();if(last){selectMove(last.el);position(last.el,last.x,last.y);dirty=true;updateMovePanel()}};
window.addEventListener('keydown',e=>{if(!moving)return;if(e.key==='Escape'){if(gesture)endGesture(true);else setMoveMode(false);e.preventDefault();return}if(e.target.matches('input,textarea,select,button'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undoMove').click();return}const dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(selected&&dirs[e.key]){e.preventDefault();const before=coords(selected),d=dirs[e.key],step=(e.shiftKey?2:.5)/printScale;position(selected,before.x+d[0]*step,before.y+d[1]*step);remember(selected,before)}});
window.addEventListener('beforeprint',()=>{endGesture();buildSheets()});
// 写真枠の形（アスペクト比）を切り替える。幅62 mmは固定で、高さだけ変える。
const ratioSelect=$('photoRatio'),photoNote=document.querySelector('.photo-help small');
function applyRatio(){const o=ratioSelect.selectedOptions[0];if(!o)return;const a=$('photoArea'),card=document.querySelector('.card.front');
 a.style.width=o.dataset.w+'mm';a.style.height=o.dataset.h+'mm';a.style.top=o.dataset.top+'mm';
 card.dataset.photoLayout=o.dataset.family;card.dataset.photoRatio=o.value;
 if(photoNote)photoNote.textContent='推奨 '+o.dataset.note;}
ratioSelect.addEventListener('change',()=>{applyRatio();dirty=true;say('写真枠の形を変更しました。')});
applyRatio();

// 教室名・キャッチコピーを表裏そろえて反映する。
const schoolInput=$('schoolNameInput'),taglineInput=$('taglineInput');
const applySchool=()=>{const v=schoolInput.value||'久保田学園　○○教室';$('schoolFront').textContent=v;$('schoolBack').textContent=v};
const applyTagline=()=>{$('taglineFront').textContent=taglineInput.value};
schoolInput.addEventListener('input',()=>{applySchool();dirty=true;say('教室名を反映しました。')});
taglineInput.addEventListener('input',()=>{applyTagline();dirty=true});
// カード上で直接書き換えたときは入力欄と相方の面に返す。
$('schoolFront').addEventListener('input',()=>{schoolInput.value=$('schoolFront').textContent;$('schoolBack').textContent=$('schoolFront').textContent});
$('schoolBack').addEventListener('input',()=>{schoolInput.value=$('schoolBack').textContent;$('schoolFront').textContent=$('schoolBack').textContent});
$('taglineFront').addEventListener('input',()=>{taglineInput.value=$('taglineFront').textContent});
applySchool();applyTagline();

window.addEventListener('beforeunload' ,e=>{if(dirty){e.preventDefault();e.returnValue=''}});refresh();
})();
</script>
